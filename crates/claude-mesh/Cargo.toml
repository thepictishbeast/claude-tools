[package]
name = "claude-mesh"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Client for agent-mesh: how Claude sessions message each other across devices"

[[bin]]
name = "claude-mesh"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
ed25519-dalek = "2"
hex = "0.4"
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
